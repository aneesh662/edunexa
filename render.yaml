services:
  - type: web
    name: online-tutorial-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: tutorial-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TUTORIAL_DATA_DIR
        value: /data
