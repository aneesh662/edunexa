{% extends "base.html" %}{% block title %}Create Account{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><h2 class="fw-bold">Create your account</h2><p class="text-secondary">Your learning journey starts here.</p>
<form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required><label class="form-label">Password</label><input class="form-control mb-4" name="password" type="password" minlength="6" required><button class="btn btn-primary w-100">Create account</button></form></div></div>
{% endblock %}
