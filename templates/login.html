{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card shadow-sm border-0"><div class="card-body p-4">
<h2 class="fw-bold mb-1">Welcome back</h2><p class="text-secondary">Sign in to continue learning.</p>
<form method="post">
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-primary w-100">Login</button>
</form>
<hr><div class="small text-muted">Demo student: student@example.com / student123</div>
</div></div></div></div></div>
{% endblock %}
